<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VehicleGPT — On-Device Vehicle Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0e1a;
      --surface: #111827;
      --surface2: #1a2235;
      --border: #1e2d45;
      --accent: #3b82f6;
      --accent-glow: rgba(59,130,246,0.15);
      --ok: #10b981;
      --warning: #f59e0b;
      --fault: #ef4444;
      --critical: #dc2626;
      --text: #e2e8f0;
      --muted: #64748b;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .logo-text h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-text span {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 400;
    }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      animation: pulse 2s infinite;
    }

    .dot.offline { background: var(--fault); animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Main Layout ── */
    .main {
      display: grid;
      grid-template-columns: 280px 1fr 300px;
      gap: 0;
      flex: 1;
      height: calc(100vh - 73px);
    }

    /* ── Sidebar ── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sidebar h3 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: 600;
    }

    .signal-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      transition: border-color 0.3s;
    }

    .signal-card.WARNING { border-color: var(--warning); }
    .signal-card.FAULT   { border-color: var(--fault); }
    .signal-card.CRITICAL { border-color: var(--critical); background: rgba(220,38,38,0.08); }

    .signal-name {
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 4px;
      font-family: 'JetBrains Mono', monospace;
    }

    .signal-value {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .severity-badge {
      font-size: 0.6rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .badge-OK       { background: rgba(16,185,129,0.15); color: var(--ok); }
    .badge-WARNING  { background: rgba(245,158,11,0.15); color: var(--warning); }
    .badge-FAULT    { background: rgba(239,68,68,0.15); color: var(--fault); }
    .badge-CRITICAL { background: rgba(220,38,38,0.2); color: var(--critical); }
    .badge-NOT_FOUND { background: rgba(100,116,139,0.15); color: var(--muted); }

    /* ── Chat Area ── */
    .chat-area {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .avatar.ai  { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .avatar.usr { background: linear-gradient(135deg, #6366f1, #4338ca); }

    .bubble {
      max-width: 70%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
    }

    .message.user .bubble {
      background: var(--accent-glow);
      border-color: rgba(59,130,246,0.3);
    }

    .bubble .status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .bubble .answer-text {
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text);
    }

    .bubble .faults-line {
      margin-top: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--fault);
    }

    .bubble .latency {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 8px;
    }

    /* ── Quick Queries ── */
    .quick-queries {
      padding: 0 32px 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quick-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .quick-btn:hover {
      border-color: var(--accent);
      background: var(--accent-glow);
      color: #60a5fa;
    }

    /* ── Input Bar ── */
    .input-bar {
      padding: 16px 32px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    #query-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #query-input:focus { border-color: var(--accent); }
    #query-input::placeholder { color: var(--muted); }

    .send-btn {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border: none;
      border-radius: 10px;
      width: 46px;
      height: 46px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: transform 0.1s, opacity 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover { transform: scale(1.05); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .thinking {
      display: flex;
      gap: 4px;
      padding: 14px 18px;
    }

    .thinking span {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .thinking span:nth-child(2) { animation-delay: 0.2s; }
    .thinking span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* ── Right Panel ── */
    .right-panel {
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-section h3 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 10px;
    }

    .fault-item {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }

    .fault-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--fault);
      font-weight: 600;
    }

    .fault-ts {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .inject-btn {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--warning);
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.78rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
      margin-bottom: 6px;
      text-align: left;
    }

    .inject-btn:hover {
      border-color: var(--warning);
      background: rgba(245,158,11,0.08);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Welcome Message ── */
    .welcome {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .welcome h2 {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .welcome p { font-size: 0.9rem; line-height: 1.6; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🚗</div>
    <div class="logo-text">
      <h1>VehicleGPT</h1>
      <span>On-Device Vehicle Intelligence</span>
    </div>
  </div>
  <div class="status-dot">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">Connecting...</span>
  </div>
</header>

<div class="main">

  <!-- ── Left: Signal Dashboard ── -->
  <div class="sidebar" id="signal-sidebar">
    <h3>Live Signals</h3>
    <div id="signal-cards">
      <div style="color: var(--muted); font-size: 0.8rem; text-align: center; padding: 20px;">
        Waiting for signals...
      </div>
    </div>
  </div>

  <!-- ── Center: Chat ── -->
  <div class="chat-area">
    <div class="chat-messages" id="chat-messages">
      <div class="welcome">
        <h2>Ask VehicleGPT</h2>
        <p>Query your vehicle's health, faults, and history<br>using plain English — all processed on-device.</p>
      </div>
    </div>

    <div class="quick-queries" id="quick-queries">
      <button class="quick-btn" onclick="sendQuery('What warnings are active right now?')">⚠️ Active warnings</button>
      <button class="quick-btn" onclick="sendQuery('What is my current engine temperature?')">🌡️ Engine temp</button>
      <button class="quick-btn" onclick="sendQuery('What fault codes are present?')">🔧 Fault codes</button>
      <button class="quick-btn" onclick="sendQuery('Is it safe to drive?')">✅ Safe to drive?</button>
      <button class="quick-btn" onclick="sendQuery('What is my fuel level?')">⛽ Fuel level</button>
    </div>

    <div class="input-bar">
      <input
        id="query-input"
        type="text"
        placeholder="Ask about your vehicle... (e.g. 'Why did the AEB activate?')"
        onkeydown="if(event.key==='Enter') sendQuery()"
      />
      <button class="send-btn" id="send-btn" onclick="sendQuery()">➤</button>
    </div>
  </div>

  <!-- ── Right: Faults + Inject ── -->
  <div class="right-panel">
    <div class="panel-section">
      <h3>Recent Faults</h3>
      <div id="fault-list">
        <div style="color: var(--muted); font-size: 0.8rem;">No faults detected.</div>
      </div>
    </div>

    <div class="panel-section">
      <h3>Inject Test Scenario</h3>
      <button class="inject-btn" onclick="injectFault('engine_overheat')">🔴 Engine Overheat</button>
      <button class="inject-btn" onclick="injectFault('low_fuel')">⛽ Low Fuel</button>
      <button class="inject-btn" onclick="injectFault('aeb_activation')">🛑 AEB Activation</button>
      <button class="inject-btn" onclick="injectFault('battery_drain')">🔋 Battery Drain</button>
      <button class="inject-btn" onclick="injectFault('tire_pressure_drop')">🔵 Tire Pressure Drop</button>
      <button class="inject-btn" onclick="injectFault('dtc_fault')">🔧 DTC Fault Code</button>
    </div>

    <div class="panel-section">
      <h3>Feed Signal Manually</h3>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <input id="feed-signal-id" placeholder="Signal ID (e.g. ENGINE_RPM)" style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px;color:var(--text);font-family:JetBrains Mono,monospace;font-size:0.75rem;outline:none;" />
        <input id="feed-signal-val" placeholder="Value (e.g. 850)" style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px;color:var(--text);font-family:JetBrains Mono,monospace;font-size:0.75rem;outline:none;" />
        <input id="feed-signal-unit" placeholder="Unit (e.g. rpm)" style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px;color:var(--text);font-family:JetBrains Mono,monospace;font-size:0.75rem;outline:none;" />
        <button onclick="feedSignal()" style="background:linear-gradient(135deg,#3b82f6,#1d4ed8);border:none;border-radius:8px;color:white;padding:8px;cursor:pointer;font-family:Inter,sans-serif;font-size:0.8rem;">📡 Feed Signal</button>
      </div>
    </div>
  </div>
</div>

<script>
  const API = `http://localhost:8765`;
  let statusPollInterval;

  // ── API Helpers ──────────────────────────────────────────
  async function apiGet(path) {
    const r = await fetch(`${API}${path}`);
    return r.json();
  }

  async function apiPost(path, body) {
    const r = await fetch(`${API}${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    return r.json();
  }

  // ── Status Polling ───────────────────────────────────────
  async function pollStatus() {
    try {
      const health = await apiGet('/health');
      document.getElementById('status-dot').className = 'dot';
      document.getElementById('status-text').textContent = `Online · ${health.ring_buffer_size} signals`;

      const status = await apiGet('/status');
      renderSignals(status.signals);

      const faults = await apiGet('/faults?days=1');
      renderFaults(faults.faults);
    } catch {
      document.getElementById('status-dot').className = 'dot offline';
      document.getElementById('status-text').textContent = 'Offline';
    }
  }

  // ── Render Signals ───────────────────────────────────────
  function renderSignals(signals) {
    const container = document.getElementById('signal-cards');
    if (!signals || Object.keys(signals).length === 0) return;

    container.innerHTML = Object.entries(signals).map(([id, s]) => {
      const val = s.str_value || (s.value !== null ? `${s.value} ${s.unit}` : 'N/A');
      const sev = s.severity || 'INFO';
      return `
        <div class="signal-card ${sev}">
          <div class="signal-name">${id}</div>
          <div class="signal-value">
            ${val}
            <span class="severity-badge badge-${sev}">${sev}</span>
          </div>
        </div>`;
    }).join('');
  }

  // ── Render Faults ────────────────────────────────────────
  function renderFaults(faults) {
    const container = document.getElementById('fault-list');
    if (!faults || faults.length === 0) {
      container.innerHTML = `<div style="color:var(--muted);font-size:0.8rem;">No faults in last 24h.</div>`;
      return;
    }
    container.innerHTML = faults.slice(0, 10).map(f => `
      <div class="fault-item">
        <div class="fault-code">${f.signal_id} = ${f.str_value || f.value || ''}</div>
        <div class="fault-ts">[${f.severity}] ${new Date(f.ts_us / 1000).toLocaleTimeString()}</div>
      </div>`).join('');
  }

  // ── Chat ─────────────────────────────────────────────────
  function sendQuery(query) {
    const input = document.getElementById('query-input');
    const q = query || input.value.trim();
    if (!q) return;

    input.value = '';
    addMessage('user', q);
    const thinkId = addThinking();

    const btn = document.getElementById('send-btn');
    btn.disabled = true;

    apiPost('/query', { query: q })
      .then(res => {
        removeThinking(thinkId);
        addMessage('ai', null, res);
        btn.disabled = false;
      })
      .catch(err => {
        removeThinking(thinkId);
        addMessage('ai', null, {
          status: 'ERROR',
          answer: 'Could not reach VehicleGPT. Is the server running?',
          severity: 'NONE',
          active_faults: [],
        });
        btn.disabled = false;
      });
  }

  function addMessage(role, text, data) {
    const container = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = `message ${role}`;

    const avatarHTML = role === 'ai'
      ? `<div class="avatar ai">🚗</div>`
      : `<div class="avatar usr">👤</div>`;

    let bubbleHTML = '';
    if (role === 'user') {
      bubbleHTML = `<div class="bubble"><div class="answer-text">${escHtml(text)}</div></div>`;
    } else if (data) {
      const sev = data.severity || 'NONE';
      const badgeClass = `badge-${data.status || 'OK'}`;
      const faultsLine = data.active_faults && data.active_faults.length > 0
        ? `<div class="faults-line">⚠ DTCs: ${data.active_faults.join(', ')}</div>`
        : '';
      const latencyLine = data._latency_ms
        ? `<div class="latency">⚡ ${data._latency_ms}ms on-device</div>`
        : '';

      bubbleHTML = `<div class="bubble">
        <div class="status-line">
          <span class="severity-badge ${badgeClass}">${data.status}</span>
          <span style="font-size:0.7rem;color:var(--muted)">severity: ${sev}</span>
        </div>
        <div class="answer-text">${escHtml(data.answer || 'No response.')}</div>
        ${faultsLine}
        ${latencyLine}
      </div>`;
    }

    div.innerHTML = avatarHTML + bubbleHTML;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return div;
  }

  function addThinking() {
    const id = 'think-' + Date.now();
    const container = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.id = id;
    div.className = 'message ai';
    div.innerHTML = `<div class="avatar ai">🚗</div><div class="bubble"><div class="thinking"><span></span><span></span><span></span></div></div>`;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return id;
  }

  function removeThinking(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  // ── Fault Injection ──────────────────────────────────────
  async function injectFault(scenario) {
    try {
      const res = await apiPost('/inject-fault', { scenario });
      addMessage('ai', null, {
        status: 'WARNING',
        answer: `Injecting scenario: "${scenario}". Watch the signal panel for updates.`,
        severity: 'MEDIUM',
        active_faults: [],
      });
    } catch {
      alert('Could not inject fault. Is the server running?');
    }
  }

  // ── Manual Signal Feed ───────────────────────────────────
  async function feedSignal() {
    const sigId = document.getElementById('feed-signal-id').value.trim();
    const sigVal = document.getElementById('feed-signal-val').value.trim();
    const sigUnit = document.getElementById('feed-signal-unit').value.trim();

    if (!sigId || !sigVal) {
      alert('Please enter Signal ID and Value.');
      return;
    }

    try {
      const val = isNaN(sigVal) ? sigVal : parseFloat(sigVal);
      const res = await apiPost('/feed-signal', {
        signal_id: sigId,
        value: val,
        unit: sigUnit,
        source: 'MANUAL_HMI',
      });
      addMessage('ai', null, {
        status: 'OK',
        answer: `Signal fed: ${sigId} = ${sigVal} ${sigUnit} [${res.signal?.severity || 'INFO'}]`,
        severity: 'NONE',
        active_faults: [],
      });
    } catch {
      alert('Could not feed signal. Is the server running?');
    }
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ── Init ─────────────────────────────────────────────────
  pollStatus();
  setInterval(pollStatus, 3000);
</script>
</body>
</html>
